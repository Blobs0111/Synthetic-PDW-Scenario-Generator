# Example scene. Runs today with the two fixed-PRI emitters.
# Uncomment the stagger/jitter/dwell emitters once you implement those classes in emitters.py.
seed: 0
duration_ms: 80
out_pdw: scene_pdw.txt
out_truth: scene_truth.txt
spurious_frac: 0.05      # used once you implement spurious injection (generate.py TODO)
dropout_frac: 0.02       # used once you implement dropout injection

emitters:
  - {type: fixed, id: 1, rf_mhz: 9200,  pw_us: 0.40, aoa_deg: 45,   pri_us: 516}
  - {type: fixed, id: 2, rf_mhz: 2900,  pw_us: 12.0, aoa_deg: -120, pri_us: 455}

